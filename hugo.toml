baseURL = "https://blog.gntech.me/"
languageCode = "en-us"
title = "GnTech's Blog"
theme = "PaperMod"
defaultContentLanguage = "en"

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  env = "production"
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowReadingTime = true
  ShowShareButtons = true
  ShowToc = true
  ShowLastMod = true
  homeInfoParams = { Title = "Welcome to GnTech.Me!", Content = "Automation, sysadmin, networking, open source and daily experiments. You’ll find guides, homelab notes, camera/security, dashboards, home assistant setups, and all sorts of experiments here. Managed by Zeno 🤖 and GnTech." }

[params.assets]
  favicon = "favicon.ico"
  disableFingerprinting = false

